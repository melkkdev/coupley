# Codemagic CI/CD — Coupley 스토어 빌드
#
# 빌드는 Codemagic 웹에서 수동으로 시작한다(자동 트리거 없음).
#
# [Codemagic 사전 설정]
# 1. Team settings > Integrations > Developer Portal
#    App Store Connect API 키를 "Coupley ASC" 이름으로 등록 (Issuer ID, Key ID, .p8)
# 2. Team settings > Code signing identities > Android keystores
#    coupley-upload.jks 업로드, reference 이름 "coupley_upload"
# 3. App settings > Environment variables
#    - 그룹 "firebase"
#        GOOGLE_SERVICES_JSON        : android/app/google-services.json 의 base64 (Secure)
#        GOOGLE_SERVICE_INFO_PLIST   : ios/Runner/GoogleService-Info.plist 의 base64 (Secure)
#    - 그룹 "app_store"
#        APP_STORE_APPLE_ID          : App Store Connect 앱 정보의 "Apple ID" (숫자)
#    - 그룹 "google_play"
#        GCLOUD_SERVICE_ACCOUNT_CREDENTIALS : Play Console API용 서비스 계정 JSON (Secure)
#
# base64 만들기 (PowerShell):
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("android\app\google-services.json")) | Set-Clipboard

definitions:
  flutter_version: &flutter_version 3.44.2
  scripts:
    - &restore_firebase
      name: Firebase 설정 파일 복원
      script: |
        echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
        echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
    - &flutter_pub_get
      name: 패키지 설치
      script: flutter pub get

workflows:
  # ── iOS: App Store Connect(TestFlight) 업로드 ──────────────────────────
  ios-release:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Coupley ASC
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - firebase
        - app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.melkk.coupley
    scripts:
      - *restore_firebase
      - *flutter_pub_get
      - name: 서명 프로파일 적용
        script: xcode-project use-profiles
      - name: IPA 빌드 (빌드 번호 = TestFlight 최신 + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ── Android: Google Play 내부 테스트 트랙 업로드 ───────────────────────
  # Play Console은 첫 AAB를 웹에서 직접 올려야 앱이 API로 열린다.
  # 첫 업로드 전에는 이 워크플로를 publishing 없이 돌려 AAB만 받아 쓰면 된다.
  android-release:
    name: Android → Play 내부 테스트
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: *flutter_version
      groups:
        - firebase
        - google_play
      android_signing:
        - coupley_upload
    scripts:
      - *restore_firebase
      - *flutter_pub_get
      - name: key.properties 생성
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: AAB 빌드 (빌드 번호 = Play 최신 + 1)
        script: |
          LATEST=$(google-play get-latest-build-number --package-name com.melkk.coupley || echo 0)
          flutter build appbundle --release --build-number=$((LATEST + 1))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
